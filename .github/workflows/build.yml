name: Build and Release CopilotArchive

permissions:
  contents: write
  
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CopilotArchive.sln

      - name: Build
        run: dotnet build CopilotArchive.sln --configuration Release

      # --- PUBLISH SYNC (framework-dependent, normal way) ---
      - name: Publish CopilotArchiveSync
        run: |
          dotnet publish src/CopilotArchiveSync/CopilotArchiveSync.csproj \
            -c Release \
            -r win-x64 \
            --self-contained false \
            -o publish/sync-win-x64

      - name: Upload Sync Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotArchiveSync-win-x64
          path: publish/sync-win-x64/

      # --- PUBLISH SEARCH (framework-dependent, normal way) ---
      - name: Publish CopilotArchiveSearch
        run: |
          dotnet publish src/CopilotArchiveSearch/CopilotArchiveSearch.csproj \
            -c Release \
            -r win-x64 \
            --self-contained false \
            -o publish/search-win-x64

      - name: Upload Search Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotArchiveSearch-win-x64
          path: publish/search-win-x64/

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download both artifacts into combined folder
      - name: Download Sync Artifact
        uses: actions/download-artifact@v4
        with:
          name: CopilotArchiveSync-win-x64
          path: release/combined/CopilotArchiveSync/

      - name: Download Search Artifact
        uses: actions/download-artifact@v4
        with:
          name: CopilotArchiveSearch-win-x64
          path: release/combined/CopilotArchiveSearch/

      # Create ZIP containing both apps
      - name: Create Combined ZIP
        run: |
          cd release/combined
          zip -r CopilotArchive-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "CopilotArchive ${{ github.ref_name }}"
          draft: false
          prerelease: false

      # Upload the combined ZIP
      - name: Upload Combined ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/CopilotArchive-${{ github.ref_name }}.zip
          asset_name: CopilotArchive-${{ github.ref_name }}.zip
          asset_content_type: application/zip
